<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Werkstatt</title>
  <link rel="stylesheet" href="/static/vendor/xterm.css?v=1793711131">
  <link rel="stylesheet" href="/static/layout.css?v=1793711131">
</head>
<body>

  <nav id="tab-leiste" role="tablist" aria-label="Projekte">
    <template id="tab-vorlage">
      <button class="tab" role="tab" type="button">
        <span class="tab-titel"></span>
        <span class="tab-schliessen" role="button" aria-label="Tab schliessen">&times;</span>
      </button>
    </template>
    <button id="tab-neu" type="button" aria-label="Projekt oeffnen">+</button>
  </nav>

  <main class="layout-grid">

    <!-- Links: Terminal, volle Hoehe -->
    <section class="bereich terminal" data-bereich="terminal">
      <div class="fenster-titel">
        <span id="terminal-titel" style="cursor:pointer;user-select:none" ondblclick="if(window.WerkstattShell){window.WerkstattShell.toggle();}">Terminal <small style="opacity:0.5">(Doppelklick f. Shell)</small></span>
        <span id="shell-diag" style="color:#f87171;font-size:11px;margin-left:8px"></span>
        <span id="shell-toggle-container"></span>
        <span id="terminal-spinner"></span>
      </div>
      <div class="scrollback" id="terminal" data-project="werkstatt"></div>
        <div class="xterm-wrap" id="terminal-xterm" hidden></div>
    </section>

    <!-- Rechts oben: Chat (pro Projekt) -->
    <section class="bereich chat" data-bereich="chat">
      <div class="fenster-titel">
        <span id="chat-titel">Chat</span>
      </div>
      <div class="chat-nachrichten" id="chat-nachrichten"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-eingabe" placeholder="Frag zum Projekt... (Strg+Enter sendet)"></textarea>
        <button class="chat-senden" type="submit">Senden</button>
      </form>
    </section>

    <!-- Rechts unten: Audit Live, mit einklappbarer History-Sidebar -->
    <section class="bereich audit" id="audit-panel" data-bereich="audit">
      <div class="fenster-titel">
        <span>Audit Live</span>
        <button class="history-toggle" id="history-toggle" aria-label="History ein-/ausblenden">&#9776;</button>
      </div>
      <div class="audit-live" id="audit-live"></div>

      <aside class="history-sidebar" id="history-sidebar">
        <div class="fenster-titel">
          <span>History</span>
          <button class="history-close" id="history-close" aria-label="History schliessen">&times;</button>
        </div>
        <div class="audit-filter">
          <label>Kind <select id="audit-filter-kind"><option value="">alle</option></select></label>
          <label>Run <input id="audit-filter-run-id" type="text" placeholder="run_id"></label>
          <button type="button" id="audit-history-laden">Filtern</button>
        </div>
        <div class="audit-history" id="audit-history"></div>
        <span id="audit-status"></span>
      </aside>
    </section>

  </main>

  <script src="/static/vendor/xterm.js?v=1793711131"></script>
  <script src="/static/vendor/addon-fit.js?v=1793711131"></script>
  <script src="/static/shell.js?v=1793711131"></script>
  <script src="/static/tabs.js?v=1793711131"></script>
  <script src="/static/terminal.js?v=1793711131"></script>
  <script src="/static/audit.js?v=1793711131"></script>
  <script src="/static/chat.js?v=1793711131"></script>
</body>
</html>

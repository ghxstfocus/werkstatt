<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Werkstatt</title>
  <link rel="stylesheet" href="/static/layout.css">
</head>
<body>

  <nav id="tab-leiste" role="tablist" aria-label="Projekte">
    <template id="tab-vorlage">
      <button class="tab" role="tab" type="button">
        <span class="tab-titel"></span>
        <span class="tab-schliessen" role="button" aria-label="Tab schliessen">&times;</span>
      </button>
    </template>
    <button id="tab-neu" type="button" aria-label="Projekt oeffnen">+</button>
  </nav>

  <main class="layout-grid">

    <!-- Links: Terminal, volle Hoehe -->
    <section class="bereich terminal" data-bereich="terminal">
      <div class="fenster-titel">
        <span id="terminal-titel">Terminal</span>
      </div>
      <div class="scrollback" id="terminal-scrollback"></div>
    </section>

    <!-- Rechts oben: Chat (pro Projekt) -->
    <section class="bereich chat" data-bereich="chat">
      <div class="fenster-titel">
        <span id="chat-titel">Chat</span>
      </div>
      <div class="chat-nachrichten" id="chat-nachrichten"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-eingabe" placeholder="Frag zum Projekt... (Strg+Enter sendet)"></textarea>
        <button class="chat-senden" type="submit">Senden</button>
      </form>
    </section>

    <!-- Rechts unten: Audit Live, mit einklappbarer History-Sidebar -->
    <section class="bereich audit" data-bereich="audit">
      <div class="fenster-titel">
        <span>Audit Live</span>
        <button class="history-toggle" id="history-toggle" aria-label="History ein-/ausblenden">&#9776;</button>
      </div>
      <div class="audit-live" id="audit-live"></div>

      <aside class="history-sidebar" id="history-sidebar">
        <div class="fenster-titel">
          <span>History</span>
          <button class="history-close" id="history-close" aria-label="History schliessen">&times;</button>
        </div>
        <div class="audit-filter">
          <label>Kind <select id="audit-filter-kind"><option value="">alle</option></select></label>
          <label>Run <input id="audit-filter-run" type="text" placeholder="run_id"></label>
          <button type="button" id="audit-filter-btn">Filtern</button>
        </div>
        <div class="audit-history" id="audit-history"></div>
      </aside>
    </section>

  </main>

  <script src="/static/tabs.js"></script>
</body>
</html>

  - id: ap-dashboard-deploy-nach-commit
    titel: "Dashboard-Deploy nach Commit"
    beschreibung: >
      systemd-gestartete Dienste laden Code beim
      Start. Nach einem Commit, der Dashboard-Code
      betrifft, laeuft der alte Code weiter, bis
      der Dienst neu gestartet wird.
    loesung: >
      Nach jedem Commit, der Dashboard-Code
      betrifft: systemctl restart
      <service>.service, systemctl status
      --no-pager | head -3. Dann Sichtpruefung
      im Browser.
    begruendung: >
      Ein Commit ist keine Deployment-Aktion.
      Der Dienst muss neu starten, damit der
      neue Code wirkt.
    anlass:
      - "security-ai, Punkt 80, 2026-10-02"
      - "erst am 2026-10-04 sichtbar, weil Dienst zwei Tage nicht neu gestartet"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder

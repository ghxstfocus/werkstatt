# anti-patterns/katalog.yaml
# Werkstatt — Anti-Pattern-Bibliothek.
#
# Sammelt bekannte Fehler-Muster, ihre Loesung und ihren
# historischen Anlass. Wird von Rollen-Prompts (Builder,
# spaeter Reviewer und Solver) gelesen, gefiltert nach
# Rolle und Trigger-Grund.
#
# Schema: siehe anti-patterns/README.md.
# Pflichtfelder pro Eintrag:
#   id, titel, beschreibung, loesung, begruendung,
#   kategorie, rollen.
# Optional:
#   anlass, audit_kinds, trigger_gruende.
#
# id-Regex: ^ap-[a-z0-9-]+$
# kategorie: 1 | 2 | 3
# rollen: nicht leer, Werte aus {builder, reviewer,
#         solver, test_generator}
# audit_kinds: muss in _AUDIT_KINDS_BEKANNT (pipeline.py)
#              enthalten sein.
# trigger_gruende: muss in ERLAUBTE_SOLVER_QUELLEN
#                  (pipeline.py) enthalten sein.

version: 1

eintraege:

  # -----------------------------------------------------------------
  # Werkstatt-Anti-Patterns (aus docs/WORKFLOW.md).
  # -----------------------------------------------------------------

  - id: ap-anker-dekorator
    titel: "Anker in Dekorator-Kette"
    beschreibung: >
      Patch-Anker auf Klassen mit Dekorator
      (@dataclass, @functools.*, @app.route) ohne den
      Dekorator einzubeziehen. Der Patch kann zwischen
      Dekorator und Klasse eingefuegt werden.
    loesung: >
      Bei Patch-Ankern auf Klassen mit Dekorator muss
      der Dekorator in den Anker aufgenommen werden.
    begruendung: >
      Der Anker ist syntaktisch eindeutig, aber
      semantisch falsch. Der Patch landet in einer
      unerwarteten Position.
    anlass:
      - "Werkstatt-Auflage 2086 (2026-10-12)"
    audit_kinds:
      - builder_anker_fehler
      - anker_einrueckung_korrigiert
    kategorie: 2
    trigger_gruende:
      - anker_nicht_gemessen
    rollen:
      - builder
      - reviewer
      - solver

  - id: ap-anker-semantik
    titel: "Patch-Anker ohne Semantik-Pruefung"
    beschreibung: >
      Ein Anker kann syntaktisch eindeutig (count == 1)
      und semantisch falsch sein. Die Pruefung auf
      Eindeutigkeit genuegt nicht.
    loesung: >
      Bei jedem Anker pruefen, ob er semantisch
      zusammenhangende Einheiten trifft. Bei Klassen
      mit Dekorator gehoert der Dekorator dazu. Bei
      Funktionsbloecken gehoeren Docstring und Signatur
      zusammen.
    begruendung: >
      Ein syntaktisch eindeutiger Anker kann trotzdem
      an der falschen Stelle greifen. Semantische
      Pruefung ist zusaetzlich noetig.
    anlass:
      - "Werkstatt-Auflage 2086 (2026-10-12)"
    audit_kinds:
      - builder_anker_fehler
    kategorie: 2
    trigger_gruende:
      - anker_nicht_gemessen
    rollen:
      - builder
      - reviewer
      - solver

  # -----------------------------------------------------------------
  # Generische Anti-Patterns (aus security-ai/docs/WORKFLOW.md,
  # Abschnitt "Anti-Patterns aus der Praxis").
  # -----------------------------------------------------------------

  - id: ap-test-name-substring
    titel: "Test-Name kollidiert mit Substring-Check"
    beschreibung: >
      Ein Test-Name kann in einen Pfad einfliessen (z.B.
      pytest tmp_path mit Testnamen). Enthaelt der Name
      einen String, auf den der Test selbst prueft,
      schlaegt die Pruefung fehl, obwohl kein Fehler
      vorliegt.
    loesung: >
      Testnamen neutral waehlen, wenn der Name in Pfade
      einfliessen kann. Oder Marker-Checks auf
      spezifische Strings einschraenken.
    begruendung: >
      Substring-Checks auf Pfade oder Responses finden
      den Test-Namen selbst und liefern
      falsch-positive Treffer.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder
      - test_generator

  - id: ap-fail-open-4xx
    titel: "Fail open bei Betriebsfehler als 4xx"
    beschreibung: >
      Ein Betriebsfehler (z.B. DB-Ausfall) wird als
      4xx-Status maskiert. Der Nutzer denkt, er habe
      sich vertippt, obwohl das System gestoert ist.
    loesung: >
      Format-Fehler als 4xx (ServiceError). Betriebs-
      fehler als 5xx (OperationError). Nicht vermischen.
      Kein breites except Exception, das 400 liefert.
    begruendung: >
      4xx bedeutet "Nutzerfehler", 5xx bedeutet
      "Systemfehler". Eine Vermischung fuehrt zu
      falscher Fehlerdiagnose und falscher
      Nutzerreaktion.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 3
    rollen:
      - builder
      - reviewer

  - id: ap-import-nachtrag-ohne-ruff
    titel: "Import-Nachtrag ohne ruff-Nachmessung"
    beschreibung: >
      Nach einer Aenderung, die Import-Zeilen ergaenzt,
      wird nur mypy isoliert gemessen, nicht ruff.
      Import-Reihenfolge-Fehler (I001) bleiben
      unentdeckt bis zur naechsten Gesamtmessung.
    loesung: >
      Nach jedem Commit mit Import- oder Signatur-
      Aenderung im Verifikationsblock ruff check .
      mitlaufen lassen.
    begruendung: >
      mypy prueft Typen, nicht Import-Reihenfolge.
      ruff ist die einzige Quelle fuer I001.
    anlass:
      - "security-ai, A900-2b-2c, Auflage 1538"
      - "behoben in 12d9a28 und 81a3607"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder

  - id: ap-code-commit-ohne-ruff
    titel: "Code-Commit ohne ruff-Messung"
    beschreibung: >
      Code wird committet, ruff laeuft nicht im selben
      Block. I001- oder andere Lint-Regressionen fallen
      erst beim naechsten Commit auf.
    loesung: >
      Vor jedem Commit, der .py-Dateien aendert,
      ruff check . ausfuehren. Bei reinen Doku-Commits
      entfaellt es. ruff nicht als letztes Glied einer
      &&-Kette unmittelbar vor git commit verketten.
    begruendung: >
      Ein ungemessener Commit ist ein unverifizierter
      Commit. Lint-Regressionen werden spaeter teuer.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder

  # -----------------------------------------------------------------
  # Bau-Chat-Befund aus der Phase-3-Recherche (2026-10-15).
  # Kein Doku-Zitat, sondern Messung in pipeline.py.
  # -----------------------------------------------------------------

  - id: ap-string-literal-statt-konstante
    titel: "String-Literal statt Konstante fuer denselben Wert"
    beschreibung: >
      Derselbe logische Wert wird an einer Stelle als
      Konstante definiert und an einer anderen als
      String-Literal verwendet. Bei Umbenennung oder
      Aenderung divergieren die Stellen unbemerkt.
    loesung: >
      Werte, die mehrfach verwendet werden, als Konstante
      zentralisieren und ausschliesslich die Konstante
      referenzieren. Kein String-Literal an zweiter
      Stelle.
    begruendung: >
      Literale werden von keinem Werkzeug als abhaengig
      erkannt. grep findet sie nur, wenn der Text
      bekannt ist. Konstanten sind ueber den Namen
      nachvollziehbar.
    anlass:
      - "Bau-Chat-Befund Phase-3-Recherche (2026-10-15)"
      - >
        Beispiel: 'anker_nicht_gemessen' als Konstante
        in ERLAUBTE_SOLVER_QUELLEN und als String-Literal
        in handle_deadlock_mit_solver (pipeline.py).
    audit_kinds: []
    kategorie: 2
    trigger_gruende:
      - wirkungsloser_patch
    rollen:
      - builder
      - reviewer
      - solver

  # -----------------------------------------------------------------
  # Generische Anti-Patterns aus security-ai/docs/WORKFLOW.md,
  # Abschnitt "Anti-Patterns aus der Praxis".
  # Phase 3a-2 (2026-10-15). 19 Eintraege.
  # -----------------------------------------------------------------

  - id: ap-auto-fix-pruefen
    titel: "Auto-Fix-Regeln pruefen, nicht blind anwenden"
    beschreibung: >
      ruff --fix --select CODE ist mechanisch, aber nicht
      immer semantisch korrekt. Ein Fix kann ruff-konform
      sein und trotzdem mypy brechen.
    loesung: >
      Vor einem Auto-Fix pruefen, ob die Regel im
      konkreten Kontext passt. Wenn ein Fix mypy bricht:
      STOP, Ursache sehen, # noqa: CODE mit Begruendung.
    begruendung: >
      Ein automatischer Fix, der eine andere Pruefung
      bricht, ist eine Regression, nicht eine Korrektur.
    anlass:
      - "security-ai, Punkt 41, 3b20891"
      - "korrigiert in 01466e0"
      - "Beispiel: B010 bei TypeVar(bound=Callable)"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder
      - reviewer

  - id: ap-api-aus-gedaechtnis
    titel: "API aus dem Gedaechtnis"
    beschreibung: >
      Aufruf einer Bibliotheks- oder Projekt-API, die
      so nicht existiert. AttributeError zur Laufzeit.
    loesung: >
      Jede Bibliotheks- oder Projekt-API mit grep, cat
      oder inspect.signature verifizieren, bevor sie
      aufgerufen wird.
    begruendung: >
      Das Modell kennt die API nicht. Aus dem
      Gedaechtnis geraten fuehrt zu Laufzeitfehlern,
      die Tests nicht zuverlaessig fangen.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
      - "Beispiel: RoleRepository.create existiert nicht"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder
      - solver

  - id: ap-modul-konstante-instanz
    titel: "Modul-Konstante vs. Instanz-Wert"
    beschreibung: >
      monkeypatch.setattr(module, "MAX_REQUESTS", 2)
      bringt nichts, wenn eine Modul-globale Instanz
      beim Import mit dem alten Wert gebaut wurde.
      Der Test misst den falschen Wert.
    loesung: >
      Bei Tests, die Modul-Konstanten beeinflussen
      wollen, die tatsaechlich verwendete Instanz
      patchen, nicht die Konstante. Oder die Instanz
      ueber eine Factory pro Test bauen.
    begruendung: >
      Eine Konstante und die daraus gebaute Instanz
      sind zwei verschiedene Objekte. Ein Patch an der
      Konstante wirkt nicht auf eine bereits
      existierende Instanz.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder
      - test_generator

  - id: ap-service-default-pfad
    titel: "Service liest Default-Pfad statt Konfig"
    beschreibung: >
      Ein Service liest relativ zum CWD statt zur
      App-Konfig, wenn kein Pfad uebergeben wird.
      Test mit leerem CWD bleibt gruen, echter Betrieb
      liest die falschen Dateien.
    loesung: >
      Bei Services, die Pfade lesen: pruefen, dass der
      Pfad aus der Konfiguration kommt, nicht aus dem
      Default. Regressionstest mit zwei Pfaden
      (tmp + CWD) bauen.
    begruendung: >
      Default-Pfade sind oft CWD-relativ. Im Test ist
      das CWD sauber, im Betrieb nicht. Der Fehler
      wird nie sichtbar.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
      - "Beispiel: read_risk_assessments ohne base_dir"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder
      - reviewer

  - id: ap-unmatched-route-403
    titel: "Unmatched Route ist 403, nicht 404"
    beschreibung: >
      Eine Route wie /approvals/ matcht
      /approvals/<request_id> nicht. before_request
      findet keine View mit _required_permission ->
      403 statt 404. Ein Test, der 404 erwartet,
      schlaegt fehl.
    loesung: >
      Wenn ein Test 404 erwartet, aber 403 kommt,
      erst pruefen, ob die Route ueberhaupt matcht.
      Fail closed (403) ist korrekt fuer unmatched
      Routes, der Test gehoert in eine eigene
      Kategorie.
    begruendung: >
      403 ist Fail-closed-Verhalten: eine unbekannte
      Route wird nicht durchgelassen. 404 wuerde
      verraten, dass die Route nicht existiert.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 3
    rollen:
      - builder
      - reviewer

  - id: ap-ruff-ausgabe-unvollstaendig
    titel: "ruff-Ausgabe vollstaendig lesen"
    beschreibung: >
      ruff check . wird ausgefuehrt, aber die Ausgabe
      ist im Terminal oder Paste abgeschnitten. Es
      wird "ruff clean" angenommen, obwohl die
      Meldung mehrere Fehler auflistet.
    loesung: >
      Vor dem Commit die ruff-Ausgabe vollstaendig
      lesen. Wenn abgeschnitten:
      ruff check . --output-format concise oder
      --statistics. ruff nicht als letztes Glied
      einer &&-Kette vor git commit verketten.
    begruendung: >
      Ein abgeschnittener Paste oder "Found N errors"
      ohne Zeilen ist keine Messung.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder
      - reviewer

  - id: ap-heredoc-ueber-3kb
    titel: "Heredoc ueber ~3 KB zerhackt"
    beschreibung: >
      cat > datei <<'EOF' mit mehr als ~3 KB Inhalt
      bricht beim Paste in die interaktive Shell ab.
      Ursache ist der Kernel-TTY-Puffer N_TTY_BUF_SIZE
      (4096 Byte).
    loesung: >
      Patch-Skripte > ~3 KB in /tmp schreiben, dort
      mit py_compile verifizieren, dann ausfuehren.
      Kein Heredoc in die interaktive Shell. Nach
      jedem cat >-Block immer verifizieren (ls -la,
      wc -l, tail -3, py_compile).
    begruendung: >
      Ein zerhackter Heredoc ist kein Shell-Bug,
      sondern ein hardcoded Kernel-Limit.
    anlass:
      - "security-ai, 2026-09-29 Commit 3 (PHASES)"
      - "security-ai, 2026-10-02/03 Punkt 80 (dreimal)"
    audit_kinds: []
    kategorie: 1
    rollen:
      - builder

  - id: ap-anker-aus-chat
    titel: "Anker aus dem Chat abgeleitet statt im Skript gemessen"
    beschreibung: >
      Der Anker sieht im Chat korrekt aus, ist im
      Skript aber zeichenweise anders (Heredoc-
      Fragmentierung, Sonderzeichen, TTY-Effekte).
      assert count == 1 schlaegt fehl.
    loesung: >
      Anker im Patch-Skript selbst ermitteln
      (lines.index, text.find, Zeilennummer aus
      text.split im selben Skript). Bei mehrzeiligen
      Ankern zeilenbasierter Schnitt statt
      String-Anker.
    begruendung: >
      Der Chat ist keine Messquelle. Zeichenweise
      Unterschiede durch Copy-Paste sind unsichtbar.
    anlass:
      - "security-ai, 2026-09-29 Commit 3 (vier Anlaeufe)"
      - "security-ai, PHASES-Duplikat"
    audit_kinds: []
    kategorie: 2
    trigger_gruende:
      - anker_nicht_gemessen
    rollen:
      - builder
      - solver

  - id: ap-cat-auf-bestehende-datei
    titel: "cat > auf eine bestehende Datei"
    beschreibung: >
      cat > datei <<'EOF' auf eine bereits getrackte
      Datei ueberschreibt sie vollstaendig. Symptom:
      Datei ploetzlich kuerzer, git status zeigt M
      statt ??, oft Datenverlust.
    loesung: >
      Vor cat > zwei Checks: git ls-files <pfad>
      und git status --porcelain. Treffer in einem
      der beiden: Patch-Skript statt cat >.
    begruendung: >
      cat > hat kein Sicherheitsnetz. Ein
      versehentlicher Aufruf loescht den Inhalt.
    anlass:
      - "security-ai, 2026-09-25 tests/unit/test_migrations.py"
      - "119 Zeilen verloren, per git checkout zurueckgeholt"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder

  - id: ap-tests-nicht-gesammelt
    titel: "Tests geschrieben, aber nicht gesammelt"
    beschreibung: >
      py_compile=OK, grep -c zaehlt N, aber
      pytest --collect-only -q liefert 0 oder
      weniger. Ursache meist Klassen mit *Tests-Suffix
      ohne unittest.TestCase-Vererbung.
    loesung: >
      Nach jeder neuen Testdatei
      pytest --collect-only -q <datei> pruefen.
      Zahl muss der Erwartung entsprechen.
    begruendung: >
      pytest-Default ist python_classes = Test*.
      Klassen mit anderem Suffix ohne TestCase werden
      nicht gesammelt und laufen nie.
    anlass:
      - "security-ai, 3.6.14 test_filters.py"
      - "FormatTsTests, FormatScoreLabelTests ohne TestCase"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder
      - test_generator

  - id: ap-fehlender-assert-patch
    titel: "Fehlender assert im Patch"
    beschreibung: >
      text.replace(anker, neu) ohne assert
      text.count(anker) == 1 schreibt auch dann, wenn
      der Anker mehrfach oder gar nicht vorkommt.
      Inhalte gehen verloren.
    loesung: >
      assert ist Pflicht. Bei count != 1: STOPP,
      cat, Anker korrigieren.
    begruendung: >
      Ohne assert ist jeder Patch ein Blindflug.
      Ein Anker, der zweimal vorkommt, aendert die
      falsche Stelle.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 2
    trigger_gruende:
      - anker_nicht_gemessen
    rollen:
      - builder
      - solver

  - id: ap-reviewer-freitext-in-shell
    titel: "Reviewer-Freitext in die Shell gepastet"
    beschreibung: >
      Begleittext aus dem Reviewer-Chat wird direkt
      in die Shell gepastet, nicht nur der Codeblock.
      Metazeichen (Backticks, Hochkommas, $, Klammern)
      werden als Shell-Syntax interpretiert.
    loesung: >
      Nur den Codeblock kopieren, nicht den
      Begleittext. Nach jedem Paste
      git status --porcelain pruefen.
      Phantom-Dateien sofort entfernen.
    begruendung: >
      Metazeichen im Freitext erzeugen command
      not found-Ketten und Phantom-Dateien.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 1
    rollen:
      - builder

  - id: ap-rueckgabe-typ-helper
    titel: "Rueckgabe-Typ beim Helper-Aufruf pruefen"
    beschreibung: >
      Ein Helper erwartet eine Sequenz (nutzt len()),
      bekommt aber eine Zahl. Python ist dynamisch,
      kein Compiler-Fehler. Der TypeError wird oft
      vom Exception-Handler geschluckt.
    loesung: >
      Vor jedem Helper-Aufruf pruefen: Was liefert
      der Aufruf, was erwartet der Helper. Nach
      jedem neuen Helper-Aufruf die erwartete
      Ausgabe testen, nicht nur die Fehlerbehandlung.
    begruendung: >
      Ein geschluckter TypeError wird als
      Fallback-Wert angezeigt (z.B. Kachel "-") und
      nie als Fehler sichtbar.
    anlass:
      - "security-ai, T3 2026-09-30"
      - "Beispiel: _safe_count(fn) mit Aggregat-Methode"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder
      - test_generator

  - id: ap-heredoc-escape-mehrzeilig
    titel: "Heredoc-Escape bei mehrzeiligen Patches"
    beschreibung: >
      Bei Heredoc-Patches mit \n im Text oder
      Skripten > ~100 Zeilen zerhackt der TTY-Puffer
      die Eingabe. Symptome: Patch laeuft nur
      teilweise, literales \n landet in der Zieldatei.
    loesung: >
      Patch-Skripte > ~100 Zeilen schrittweise mit >>
      an eine /tmp-Datei anhaengen. Nach jedem Teil:
      wc -l. Bei \n im Text: chr(10) statt "\n",
      oder mehrzeilige Strings mit echten
      Zeilenumbruechen.
    begruendung: >
      Literales \n in der Zieldatei erzeugt
      SyntaxError: unexpected character after line
      continuation character.
    anlass:
      - "security-ai/docs/WORKFLOW.md, Abschnitt Anti-Patterns"
    audit_kinds: []
    kategorie: 1
    rollen:
      - builder

  - id: ap-backtick-in-commit-msg
    titel: "Backtick-! in Commit-Messages"
    beschreibung: >
      Ein Commit-Text mit Backtick-Ausrufezeichen
      (!) wird von der Shell als History-Expansion
      interpretiert. Die Commit-Message wird
      abgeschnitten, die Datei trotzdem committet.
    loesung: >
      Solche Zeichen vermeiden, oder
      git commit -F /tmp/msg.txt mit Datei nutzen.
    begruendung: >
      History-Expansion tritt nur bei interaktiver
      Shell mit aktivierter Expansion auf. Eine
      Datei umgeht das Problem.
    anlass:
      - "security-ai, Punkt 83, 2026-10-02, Commit 3784998"
    audit_kinds: []
    kategorie: 1
    rollen:
      - builder

  - id: ap-hash-zirkel-doku
    titel: "Hash-Zirkel in Doku-Eintraegen"
    beschreibung: >
      Ein SECURITY_REVIEW_LOG-Eintrag enthaelt den
      Commit-Hash, der ihn selbst committet. Der
      Hash aendert sich bei jedem Amend. Amend-Zirkel.
    loesung: >
      Kein Commit-Hash im Eintrag selbst. Hash in
      die Commit-Message, oder in einem separaten
      Nachzug-Commit nachtragen.
    begruendung: >
      Ein Eintrag, der sich selbst referenziert,
      kann nicht stabil committet werden. Jeder
      Amend aendert den Hash.
    anlass:
      - "security-ai, Punkt 84, 2026-10-03"
      - "aufgeloest durch Nachzug-Commit 32bca09"
    audit_kinds: []
    kategorie: 1
    rollen:
      - builder
      - reviewer

  - id: ap-ruff-ohne-pipe
    titel: "ruff ohne Pipe pruefen"
    beschreibung: >
      ruff check . | tail -5 liefert den Exit-Code
      von tail, nicht von ruff. Ein ruff-Fehler wird
      verschluckt, die Vollsuite laeuft unnoetig.
    loesung: >
      ruff isoliert aufrufen, ohne Pipe, ohne
      &&-Kette. Exit-Code pruefen. Dann mypy
      isoliert, dann pytest.
    begruendung: >
      Exit-Code ist die einzige verlaessliche
      Fehlerquelle. Eine Pipe maskiert ihn.
    anlass:
      - "security-ai, Punkt 58, 2026-10-04"
    audit_kinds: []
    kategorie: 2
    rollen:
      - builder

  - id: ap-fragezeichen-nach-patch
    titel: "?? nach Patch pruefen"
    beschreibung: >
      Paste-Unfaelle erzeugen Phantom-Dateien
      (0 Byte), die nicht ins Repo gehoeren.
      git status --porcelain zeigt sie mit ??.
    loesung: >
      Nach jedem Patch-Block git status
      --porcelain auf ??-Eintraege pruefen.
      Wenn Datei unbekannt: entfernen mit
      rm -- 'name'.
    begruendung: >
      Phantom-Dateien verunreinigen das Repo und
      werden beim naechsten git add versehentlich
      mitcommittet.
    anlass:

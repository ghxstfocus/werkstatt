project: homelab-security-ai
project_dir: /opt/security-ai
docs:
  entry: AGENTS.md
  status: docs/STATUS.md
  roadmap: docs/ROADMAP.md
  architecture: docs/ARCHITECTURE.md
  conventions: docs/CONVENTIONS.md
  adr_index: docs/adr/README.md
  glossary: docs/glossary.md
  security_log: docs/SECURITY_LOG.md
  web_security: docs/WEB_SECURITY_CHECKLIST.md
always_run:
- py_compile
- ruff
- mypy
- test_count
- git_status
- git_head
optional_catalog:
- bandit
- pip_audit
- read_file
- mypy_tests
- pytest
agent_docs:
  reviewer:
  - conventions
  - web_security
  builder:
  - conventions
  - web_security
  test_generator:
  - conventions
  solver:
  - conventions
  - web_security
  planner:
  - conventions
file_whitelist:
- apps/
- core/
- data/
- harness/
- tools/
- docs/
- tests/
- scripts/
venv_python: /opt/security-ai/.venv/bin/python3
budget:
  max_review_rounds: 2
  max_minutes: 15
  max_llm_calls: 30
  max_builder_runden: 3
  max_llm_calls_phase: 200
  max_tokens_builder: 8192
  max_tokens_judge: 32768
  max_tokens_reviewer: 1024
  max_tokens_planner: 8192
  max_tokens_solver: 2048
auto_repair:
  enabled: true
  max_attempts: 3
  auto_fix_ruff: true
  auto_fix_ruff_format: true
  escalate_after_attempts: true
  escalate_if_errors_over: 20
require_human_approval: true
review_commit_package: true
git_author:
  name: ghxstfocus
  email: ghxst.focus@gmail.com
solver:
  p1_schwellwert: 0.5
  p1_min_tokens: 10
  max_runden: 3
planner:
  modus: manual
  max_runden: 3
  ask_human_timeout_min: 60
  phasen_modus: false

[tool.importlinter]
root_package = "werkstatt"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "render ist eine Leaf-Schicht"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["werkstatt.render"]
forbidden_modules = [
    "werkstatt.phases",
    "werkstatt.roles",
    "werkstatt.web",
]

[[tool.importlinter.contracts]]
name = "roles.builder kennt keine phases oder web"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["werkstatt.roles.builder"]
forbidden_modules = [
    "werkstatt.phases",
    "werkstatt.web",
]

[[tool.importlinter.contracts]]
name = "phases kennt keine web"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["werkstatt.phases"]
forbidden_modules = ["werkstatt.web"]

[tool.ruff.lint]
# Bewusst ignoriert (kategorisiert, nicht pauschal):
#
#   S110  (try-except-pass) + BLE001 (blind-except) auf LEGITIMEN
#   fail-soft-Pfaden. Kategorien:
#
#   - UI / Web (werkstatt/web/*):       UI darf nie crashen
#   - Render / Progress / Spinner:      Darstellung ist Kosmetik
#   - Skills-Laden:                     fehlende Skill-Datei ist ok
#   - Cache / Prefetch:                 Cache-Miss ist kein Fehler
#   - Test / CLI / Hooks:               Test-Infra, Skripte
#
# NICHT ignoriert: S110/BLE001 in kritischen Pfaden (Contract-
# Violation, Gate-Fehler, Verify-Stage-Audit). Diese 9 Stellen
# rufen audit_safe() auf (werkstatt/audit.py), das logger-Fehler
# sichtbar auf stderr schreibt. Commits 6b30b7c + 7a09ba2.
#
# RUF100 (unused-noqa) ebenfalls ignoriert: Nach BLE001/S110-
# Ignore werden die ~115 existierenden '# noqa: BLE001, S110'-
# Kommentare redundant. Sie bleiben im Code (harmlos), aber
# 'ruff --select RUF100 --fix' wuerde auch die legitimen
# '# noqa: F401  # re-export: ...'-Marker entfernen — 107
# Fehler wurden dabei sichtbar (Commit c08e899-Kontext).
# Redundante noqa werden in einer eigenen OP selektiv entfernt
# (siehe PROGRESS.md / OP-147d).
ignore = ["BLE001", "S110", "RUF100"]

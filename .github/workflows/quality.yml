name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose the production checkout path
        run: sudo ln -s "$GITHUB_WORKSPACE" /opt/werkstatt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Check JavaScript syntax
        run: find static -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Ruff
        run: python -m ruff check . --output-format concise

      - name: Run pytest with diagnostics
        run: python -m pytest -q

      - name: Run quality gate
        run: python -m tools.quality_gate --json

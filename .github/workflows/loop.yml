name: werkstatt-loop

on:
  workflow_dispatch:
    inputs:
      aufgabe:
        description: "Aufgabentext (leer = naechster offener OP aus STATUS.md)"
        required: false
        default: ""
      dry_run:
        description: "Dry-Run (kein LLM, kein Patch)"
        type: boolean
        default: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WERKSTATT_RENDER: ci
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Aufgabe bestimmen
        id: aufgabe
        run: |
          if [ -n "${{ inputs.aufgabe }}" ]; then
            echo "text=${{ inputs.aufgabe }}" >> "$GITHUB_OUTPUT"
          else
            # erster offener OP aus docs/STATUS.md
            TEXT=$(python3 -c "
          import re
          from pathlib import Path
          s = Path('docs/STATUS.md').read_text()
          m = re.search(r'### (OP-\d+):[^\n]*\n(.*?)(?=\n### |\n## |\Z)', s, re.DOTALL)
          if m:
              print(f'Setze {m.group(1)} um.\n\nLies docs/STATUS.md {m.group(1)}.\n\n### {m.group(1)}:{m.group(2)}')
          ")
            {
              echo "text<<__AUTGABE_EOF__"
              echo "$TEXT"
              echo "__AUTGABE_EOF__"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Loop starten
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          . .venv/bin/activate
          A="$(cat <<'__AUFGABE_EOF__'
          ${{ steps.aufgabe.outputs.text }}
          __AUFGABE_EOF__
          )"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 -m werkstatt.loop --project werkstatt --fresh --dry-run --aufgabe "$A"
          else
            python3 -m werkstatt.loop --project werkstatt --fresh --auto-approve --aufgabe "$A"
          fi

      - name: Artefakt (Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: werkstatt-loop-log
          path: |
            .werkstatt/
            logs/
          if-no-files-found: warn
          retention-days: 7
